# 本檔案用來維護需要人工補充的「注意事項」。沒有符合設定的功能頁，
# 產生文件時就不會顯示注意事項區塊。
#
# 【如何指定功能頁】
# 系統使用爬蟲 Metadata 內的 menu_index 與 tab_index 對應頁面，而不是用
# Word 文件頁碼，也不是畫面上顯示的名稱。因此中英文可以共用同一筆設定。
#
# index 是「從 0 開始計算的順序編號」：
#   menu_index: 左側功能選單的順序編號。第一個功能為 0、第二個為 1，依此類推。
#   tab_index:  該功能頁內頁籤的順序編號。第一個頁籤為 0、第二個為 1，依此類推。
#   tab_indexes: 要套用注意事項的 tab_index 清單，可同時指定一個或多個頁籤。
#
# 最方便的查找方式是開啟 config/manual_content/zh-TW.yaml：
#   page_key: menu:1/tab:0 代表 menu_index 為 1、tab_index 為 0。
#   page_key: menu:0       代表 menu_index 為 0，而且該功能頁沒有頁籤。
# category、page、tab 欄位則是方便人工確認的功能名稱，不參與程式比對。
#
# 【設定範例】
# 1. 套用到整個功能頁（包含沒有頁籤的頁面）：
#      - menu_index: 0
#        notes: ...
#    不填 tab_indexes，即表示不限制頁籤。
#
# 2. 只套用到單一頁籤：
#      - menu_index: 1
#        tab_indexes: [2]
#        notes: ...
#
# 3. 同一則注意事項套用到多個頁籤：
#      - menu_index: 1
#        tab_indexes: [0, 1]
#        notes: ...
#
# notes 下可分別填寫 zh-TW 與 en；每個「-」代表一則注意事項。
# 若只提供其中一種語言，另一語言的文件不會顯示該筆文字。
#
# 舊版 manualwriter YAML 中的頁面摘要、欄位定義、爬蟲安全規則與編輯 TODO
# 屬於來源資料或內部審查狀態，不應放進本檔案。本檔案只放已確認、需要讓
# 最終使用者知道的操作限制或提醒。

entries:
  # 功能位置：域名洞悉 > 歷史記錄 > 代理／防火牆
  # menu_index 1 = 歷史記錄；tab_index 0 = 代理；tab_index 1 = 防火牆。
  # 「新觀察」的 tab_index 是 2，此處刻意不包含，所以不會顯示這則注意事項。
  - menu_index: 1
    tab_indexes: [0, 1]
    notes:
      zh-TW:
        - >-
          CSV 僅會匯出目前已載入的記錄。頁面初始載入 100 頁（2,500 筆），
          每次按下頁數按鈕會再載入 100 頁（2,500 筆）；最後不足 100 頁時，
          按鈕會顯示剩餘頁數。例如共有 380 頁時，載入順序為
          100（2,500 筆）→ 200（5,000 筆）→ 300（7,500 筆）→ 80（9,500 筆）。
      en:
        - >-
          CSV exports only the records currently loaded. The page initially
          loads 100 pages (2,500 records); each press of the page-count button
          loads another 100 pages (2,500 records). The final button shows the
          remaining pages. For 380 pages, the sequence is 100 (2,500) →
          200 (5,000) → 300 (7,500) → 80 (9,500 records).
