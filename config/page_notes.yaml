# Manually maintained notes shown in the generated manuals.
#
# Matching uses crawler indexes so the same entry works for every language:
#   menu_index: sidebar function index
#   tab_indexes: optional tab indexes; omit it to apply to the whole page
#
# A page or tab without a matching entry does not display a Notes section.
#
# The legacy manualwriter YAML was reviewed before adding entries here. Its
# page leads, field definitions, crawler safety rules and editorial TODOs are
# source material or internal review state, not end-user cautions. They remain
# outside this file. Only verified operational caveats belong below.

entries:
  # Domain Insights > History Logs > Proxy / Firewall
  # New Observed (tab_index 2) is intentionally not included.
  - menu_index: 1
    tab_indexes: [0, 1]
    notes:
      zh-TW:
        - >-
          CSV 僅會匯出目前已載入的記錄。頁面初始載入 100 頁（2,500 筆），
          每次按下頁數按鈕會再載入 100 頁（2,500 筆）；最後不足 100 頁時，
          按鈕會顯示剩餘頁數。例如共有 380 頁時，載入順序為
          100（2,500 筆）→ 200（5,000 筆）→ 300（7,500 筆）→ 80（9,500 筆）。
      en:
        - >-
          CSV exports only the records currently loaded. The page initially
          loads 100 pages (2,500 records); each press of the page-count button
          loads another 100 pages (2,500 records). The final button shows the
          remaining pages. For 380 pages, the sequence is 100 (2,500) →
          200 (5,000) → 300 (7,500) → 80 (9,500 records).
