    - Rule 1
    - Rule 2
    - Rule 3
    content:
      overview: The Dynamic Block page provides three independent rule slots (Rule 1–3) for configuring
        automated traffic blocking based on IP ranges and DNS metrics. Administrators can define specific
        thresholds and durations for Query Rate, RCode Rate, RCode Ratio, and QType Rate to trigger blocking
        actions.
      business_value: ''
      button_descriptions:
      - action_id: button-0
        include: true
        confidence: 0.95
        description: Saves and applies the changes immediately.
      - action_id: button-1
        include: true
        confidence: 0.95
        description: Displays help and usage instructions for the current page.
      interaction_sections: []
      page_sections:
      - 'IP Range: Defines the scope of IP addresses to which the rule applies, including status, action
        (Exclude/Include), and IPv4/IPv6 ranges.'
      - 'Query Rate: Configures blocking criteria based on the rate of DNS queries.'
      - 'RCode Rate: Configures blocking criteria based on the rate of specific response codes.'
      - 'RCode Ratio: Configures blocking criteria based on the ratio of specific response codes relative
        to total responses.'
      - 'QType Rate: Configures blocking criteria based on the rate of specific query types.'
      field_descriptions:
      - 'Query Rate－Rate: Specifies the threshold rate of queries per second that triggers the blocking
        action.'
      - 'Query Rate－Duration: Defines the time window in seconds over which the query rate is calculated.'
      - 'Query Rate－Blocking Time: Sets the duration for which the target is blocked when the rate threshold
        is exceeded.'
      - 'RCode Rate－Rate: Specifies the threshold rate of response codes per second that triggers the
        blocking action.'
      - 'RCode Rate－Duration: Defines the time window in seconds over which the response code rate is
        calculated.'
      - 'RCode Rate－Blocking Time: Sets the duration for which the target is blocked when the response
        code rate threshold is exceeded.'
      - 'RCode Ratio－Ratio: Specifies the percentage threshold of response codes that triggers the blocking
        action.'
      - 'RCode Ratio－Duration: Defines the time window in seconds over which the response code ratio is
        calculated.'
      - 'RCode Ratio－Blocking Time: Sets the duration for which the target is blocked when the response
        code ratio threshold is exceeded.'
      - 'RCode Ratio－Minimum number of Responses: Defines the minimum number of responses required before
        the ratio calculation is applied.'
      - 'QType Rate－Rate: Specifies the threshold rate of query types per second that triggers the blocking
        action.'
      - 'QType Rate－Duration: Defines the time window in seconds over which the query type rate is calculated.'
      - 'QType Rate－Blocking Time: Sets the duration for which the target is blocked when the query type
        rate threshold is exceeded.'
      best_practices: []
      restrictions: []
